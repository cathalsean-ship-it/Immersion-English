<style>/* Immersion English — homepage styles */

:root {
  --green: #008037;
  --green-deep: #006a2d;
  --green-soft: #e8f1ea;
  --orange: #FF914D;
  --off-white: #FEFFFE;
  --cream: #FAF8F3;
  --ink: #14201a;
  --ink-soft: #4a5750;
  --line: #e6e2d8;
  --line-strong: #d4cebf;
  --shadow-sm: 0 1px 2px rgba(20,32,26,0.04), 0 2px 8px rgba(20,32,26,0.04);
  --shadow-md: 0 4px 14px rgba(20,32,26,0.06), 0 16px 40px rgba(20,32,26,0.06);
  --radius-sm: 6px;
  --radius-md: 14px;
  --radius-lg: 22px;
  --maxw: 1280px;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--off-white);
  color: var(--ink);
  font-family: 'Lato', system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
  font-size: 17px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

img { max-width: 100%; display: block; }

h1, h2, h3, h4, h5, .display, .nav-brand {
  font-family: 'Montserrat', system-ui, sans-serif;
  font-weight: 600;
  letter-spacing: -0.015em;
  color: var(--ink);
  margin: 0;
  text-wrap: balance;
}

h1 { font-size: clamp(2.4rem, 4.8vw, 4.2rem); line-height: 1.05; letter-spacing: -0.025em; font-weight: 700; }
h2 { font-size: clamp(1.9rem, 3.2vw, 2.7rem); line-height: 1.1; }
h3 { font-size: clamp(1.2rem, 1.6vw, 1.4rem); line-height: 1.25; }

p { margin: 0; text-wrap: pretty; }

.eyebrow {
  font-family: 'Montserrat', sans-serif;
  text-transform: uppercase;
  letter-spacing: 0.18em;
  font-size: 0.72rem;
  font-weight: 600;
  color: var(--green);
}

.eyebrow-dot::before {
  content: '';
  display: inline-block;
  width: 6px;
  height: 6px;
  background: var(--green);
  border-radius: 50%;
  margin-right: 0.7em;
  vertical-align: middle;
  transform: translateY(-2px);
}

.container {
  width: 100%;
  max-width: var(--maxw);
  margin: 0 auto;
  padding: 0 32px;
}

@media (max-width: 720px) {
  .container { padding: 0 20px; }
}

/* ---------- NAV ---------- */

.nav {
  position: sticky;
  top: 0;
  z-index: 50;
  background: transparent;
  backdrop-filter: saturate(140%) blur(10px);
  -webkit-backdrop-filter: saturate(140%) blur(10px);
  border-bottom: 1px solid rgba(20,32,26,0.06);
  isolation: isolate;
}

.nav::before {
  content: '';
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: -1;
  background: linear-gradient(180deg, rgba(254,255,254,0.7) 0%, rgba(254,255,254,0.0) 100%);
}

.nav-inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 72px;
  gap: 24px;
}

.nav-brand {
  display: flex;
  align-items: center;
  gap: 10px;
  font-weight: 700;
  font-size: 1.05rem;
  letter-spacing: -0.01em;
  text-decoration: none;
  color: var(--ink);
}

.nav-mark {
  width: 32px;
  height: 32px;
  border-radius: 8px;
  background: var(--green);
  display: grid;
  place-items: center;
  color: white;
  font-family: 'Montserrat', sans-serif;
  font-weight: 700;
  font-size: 0.95rem;
  letter-spacing: -0.02em;
}

.nav-links {
  display: flex;
  gap: 28px;
  align-items: center;
}

.nav-links a {
  color: var(--ink-soft);
  text-decoration: none;
  white-space: nowrap;
  font-size: 0.94rem;
  font-weight: 500;
  transition: color 0.15s ease;
}
.nav-links a:hover { color: var(--green); }

.nav-cta {
  background: var(--orange);
  color: white !important;
  padding: 10px 18px;
  border-radius: 999px;
  font-weight: 600 !important;
  font-size: 0.88rem !important;
  transition: background 0.15s ease, transform 0.15s ease;
}
.nav-cta:hover { background: var(--orange-deep, #e87a36) !important; transform: translateY(-1px); }

@media (max-width: 840px) {
  .nav-links { display: none; }
}

/* Hamburger */
.nav-burger {
  display: none;
  appearance: none;
  border: 0;
  background: transparent;
  width: 40px;
  height: 40px;
  padding: 8px;
  cursor: pointer;
  flex-direction: column;
  justify-content: center;
  gap: 5px;
  align-items: stretch;
  z-index: 60;
}
.nav-burger span {
  display: block;
  height: 2px;
  background: var(--ink);
  border-radius: 2px;
  transition: transform 0.2s ease, opacity 0.2s ease, background 0.15s ease;
}
.nav.over-hero .nav-burger span { background: white; }

@media (max-width: 840px) {
  .nav-burger { display: flex; }
}

/* Backdrop behind the slide-in menu */
.nav-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  z-index: 54;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.22s ease;
}
.nav-backdrop.open { opacity: 1; pointer-events: auto; }

/* Slide-in drawer menu */
.nav-overlay {
  position: fixed;
  top: 0;
  right: 0;
  bottom: 0;
  width: min(82vw, 360px);
  background: var(--ink);
  color: white;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  justify-content: center;
  gap: 24px;
  z-index: 55;
  transform: translateX(100%);
  transition: transform 0.24s cubic-bezier(0.32, 0.72, 0.24, 1);
  padding: 80px 36px 48px;
  box-shadow: -16px 0 40px rgba(0,0,0,0.3);
}
.nav-overlay.open { transform: translateX(0); }
.nav-overlay a {
  color: white;
  text-decoration: none;
  font-family: 'Montserrat', sans-serif;
  font-weight: 500;
  font-size: 1.5rem;
  letter-spacing: -0.01em;
}
.nav-overlay a:not(.nav-overlay-cta):hover { color: var(--orange); }
.nav-overlay-cta {
  margin-top: 24px;
  font-size: 1rem !important;
  font-weight: 600 !important;
  align-self: stretch;
  justify-content: center;
}

.nav-overlay-close {
  position: absolute;
  top: 20px;
  right: 20px;
  width: 40px;
  height: 40px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: rgba(255,255,255,0.08);
  color: white;
  border: 0;
  cursor: pointer;
  transition: background 0.15s ease;
}
.nav-overlay-close:hover { background: rgba(255,255,255,0.16); }

/* ---------- BUTTONS ---------- */

.btn {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  padding: 16px 28px;
  border-radius: 999px;
  font-family: 'Montserrat', sans-serif;
  font-weight: 600;
  font-size: 0.98rem;
  letter-spacing: 0.005em;
  text-decoration: none;
  border: none;
  cursor: pointer;
  transition: transform 0.18s ease, background 0.18s ease, box-shadow 0.18s ease;
}

.btn-primary {
  background: var(--orange);
  color: white;
  box-shadow: 0 6px 20px rgba(255,145,77,0.32);
}
.btn-primary:hover { background: var(--orange-deep, #e87a36); transform: translateY(-1px); box-shadow: 0 10px 28px rgba(255,145,77,0.42); }

.btn-ghost {
  background: transparent;
  color: var(--ink);
  border: 1px solid var(--line-strong);
}
.btn-ghost:hover { border-color: var(--ink); }

.btn-arrow {
  display: inline-grid;
  place-items: center;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: rgba(255,255,255,0.18);
  transition: transform 0.18s ease;
}
.btn:hover .btn-arrow { transform: translateX(3px); }

/* ---------- HERO (full-bleed) ---------- */

.hero {
  position: relative;
  min-height: 88vh;
  display: flex;
  align-items: stretch;
  color: white;
  overflow: hidden;
  isolation: isolate;
  padding-bottom: 40px; /* room for the floating badge */
}

.hero-bg {
  position: absolute;
  inset: 0;
  z-index: -2;
  background-color: #1a2a20;
  background-size: cover;
  background-position: center 40%;
}

.hero-bg::before {
  content: '';
  position: absolute;
  inset: 0;
  background:
    linear-gradient(180deg,
      rgba(20, 32, 26, 0.35) 0%,
      rgba(20, 32, 26, 0.55) 45%,
      rgba(20, 32, 26, 0.92) 100%),
    linear-gradient(95deg,
      rgba(0, 80, 40, 0.45) 0%,
      rgba(20, 32, 26, 0.15) 50%,
      rgba(20, 32, 26, 0.0) 100%);
}

.hero-inner {
  position: relative;
  z-index: 1;
  width: 100%;
  display: flex;
  align-items: flex-end;
  padding: 140px 0 72px;
}

.hero-copy {
  max-width: 760px;
}

.hero h1 { color: white; }
.hero h1 .accent-mark { color: var(--orange); }

.hero-side {
  position: absolute;
  right: 40px;
  bottom: 120px;
  z-index: 2;
  display: flex;
  flex-direction: column;
  gap: 16px;
  align-items: flex-end;
  pointer-events: none;
}
.hero-side > * { pointer-events: auto; }

@media (max-width: 960px) {
  .hero-side { display: none; }
  .hero-inner { padding: 120px 0 56px; }
}

.hero-tag {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  padding: 7px 14px 7px 8px;
  border-radius: 999px;
  background: rgba(255,255,255,0.12);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 1px solid rgba(255,255,255,0.18);
  color: white;
  font-family: 'Montserrat', sans-serif;
  font-weight: 600;
  font-size: 0.78rem;
  letter-spacing: 0.04em;
  margin-bottom: 28px;
}

.hero-tag-pill {
  background: white;
  color: var(--green);
  padding: 3px 10px;
  border-radius: 999px;
  font-size: 0.7rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}


.hero-sub {
  margin-top: 28px;
  font-size: 1.18rem;
  color: rgba(255,255,255,0.85);
  max-width: 56ch;
  line-height: 1.55;
}

.hero-cta-row {
  margin-top: 36px;
  display: flex;
  gap: 16px;
  align-items: center;
  flex-wrap: wrap;
}

.hero-meta {
  margin-top: 56px;
  padding-top: 28px;
  border-top: 1px solid rgba(255,255,255,0.18);
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 20px;
  max-width: 640px;
}

.hero-meta-item .num {
  font-family: 'Montserrat', sans-serif;
  font-weight: 700;
  font-size: 1.7rem;
  color: white;
  letter-spacing: -0.02em;
  display: block;
  line-height: 1;
  text-shadow: 0 1px 8px rgba(0,0,0,0.45);
}

.hero-meta-item .lbl {
  display: block;
  margin-top: 8px;
  font-size: 0.84rem;
  color: rgba(255,255,255,0.82);
  letter-spacing: 0.01em;
  text-shadow: 0 1px 6px rgba(0,0,0,0.45);
}

/* Mobile-only show/hide helpers used by the hero */
.hero-sub-mobile { display: none; }
.hero-tag-text-mobile { display: none; }

/* Hero price badge — floats over the photo, fully contained */
.hero-badge {
  width: 150px;
  height: 150px;
  border-radius: 50%;
  background: var(--green);
  color: white;
  display: grid;
  place-items: center;
  text-align: center;
  font-family: 'Montserrat', sans-serif;
  font-weight: 700;
  line-height: 1.1;
  box-shadow: 0 16px 40px rgba(0,0,0,0.3);
  transform: rotate(-6deg);
}

.hero-photo-credit { display: none; }

.hero-badge .price {
  font-size: 1.55rem;
  letter-spacing: -0.02em;
  display: block;
}

.hero-badge .label {
  font-size: 0.62rem;
  font-weight: 500;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  opacity: 0.95;
  display: block;
  margin-top: 4px;
}

@media (max-width: 720px) {
  .hero-badge { width: 110px; height: 110px; }
  .hero-badge .price { font-size: 1.2rem; }
  .hero-meta { grid-template-columns: repeat(2, 1fr); }
}

/* ---------- MOBILE — hero / nav / gallery refinements ---------- */
@media (max-width: 720px) {
  .hero { min-height: auto; padding-bottom: 56px; }
  .hero-inner { padding: 96px 0 40px; }

  /* Headline: 3 lines max, "Not just learned." on its own */
  .hero h1 {
    font-size: clamp(1.8rem, 8.4vw, 2.4rem) !important;
    line-height: 1.08;
    letter-spacing: -0.02em;
  }

  /* Pill: drop the long text, keep a tighter location */
  .hero-tag { padding: 6px 12px 6px 6px; margin-bottom: 20px; }
  .hero-tag-text { display: none; }
  .hero-tag-text-mobile { display: inline; font-size: 0.74rem; }

  /* Shorter body at mobile so CTA sits above the fold */
  .hero-sub { display: none; }
  .hero-sub-mobile {
    display: block;
    margin-top: 18px;
    font-size: 1rem;
    color: rgba(255,255,255,0.85);
    line-height: 1.5;
  }

  .hero-cta-row { margin-top: 22px; gap: 12px; flex-direction: column; align-items: stretch; }
  .hero-cta-row .btn { padding: 14px 22px; font-size: 0.92rem; justify-content: center; width: 100%; }

  /* Stash the meta strip lower so it doesn't bloat the fold */
  .hero-meta { margin-top: 36px; padding-top: 22px; gap: 16px; }
  .hero-meta-item .num { font-size: 1.25rem; }
  .hero-meta-item .lbl { font-size: 0.76rem; }

  /* Focus the photo on buildings, not sky, at narrow viewports */
  .hero-bg { background-position: center 75% !important; }

  /* Badge: smaller, positioned not to collide with CTA */
  .hero-side { right: 16px; bottom: 16px; }
  .hero-badge { width: 96px !important; height: 96px !important; transform: rotate(-6deg); }
  .hero-badge .price { font-size: 1.05rem; }
  .hero-badge .label { font-size: 0.5rem; letter-spacing: 0.1em; }

  .hero-meta-item:nth-child(3) { display: none; }
}

/* Excursions grid — 2 columns on mobile, 5th spans full width */
@media (max-width: 720px) {
  .dub-grid {
    grid-template-columns: 1fr 1fr !important;
    grid-auto-rows: 200px !important;
    gap: 14px;
  }
  .dub-tile, .dub-tile:nth-child(4), .dub-tile:nth-child(5) { grid-column: auto; }
  .dub-tile:nth-child(5) { grid-column: 1 / -1 !important; }
  .dub-tile-overlay { padding: 16px; }
  .dub-tile-overlay .name { font-size: 1.05rem; }
  .dub-tile-overlay .sub { font-size: 0.78rem; }
}

/* Over the hero: dark gradient + white text */
.nav.over-hero {
  border-bottom-color: rgba(255,255,255,0.06);
}
.nav.over-hero::before {
  background: linear-gradient(180deg, rgba(20,32,26,0.55) 0%, rgba(20,32,26,0.0) 100%);
}
.nav.over-hero .nav-brand,
.nav.over-hero .nav-brand span { color: white; text-shadow: 0 1px 6px rgba(0,0,0,0.4); }
.nav.over-hero .nav-links a:not(.nav-cta) {
  color: rgba(255,255,255,0.95);
  text-shadow: 0 1px 6px rgba(0,0,0,0.45);
}
.nav.over-hero .nav-links a:not(.nav-cta):hover { color: white; }

/* ---------- PLACEHOLDER IMAGES ---------- */

.ph {
  width: 100%;
  height: 100%;
  position: relative;
  display: grid;
  place-items: center;
  overflow: hidden;
  background:
    repeating-linear-gradient(
      135deg,
      rgba(20,32,26,0.04) 0 2px,
      transparent 2px 14px
    ),
    var(--ph-bg, #d8d4c8);
}

.ph-label {
  position: absolute;
  bottom: 14px;
  left: 14px;
  right: 14px;
  font-family: 'JetBrains Mono', ui-monospace, monospace;
  font-size: 0.7rem;
  color: rgba(20,32,26,0.55);
  letter-spacing: 0.02em;
  text-align: left;
}

.ph-green { --ph-bg: #c8d8cc; }
.ph-stone { --ph-bg: #d6d2c5; }
.ph-warm  { --ph-bg: #e2d4c1; }
.ph-blue  { --ph-bg: #c7d2d8; }
.ph-deep  { --ph-bg: #b8c4ba; }
.ph-clay  { --ph-bg: #d7c3b0; }

/* ---------- SECTION ---------- */

.section {
  padding: 72px 0;
}

.section-head {
  max-width: 720px;
  margin-bottom: 56px;
}

.section-head .eyebrow {
  margin-bottom: 18px;
  display: block;
}

.section-head h2 {
  margin-bottom: 16px;
}

.section-head p {
  font-size: 1.08rem;
  color: var(--ink-soft);
  max-width: 56ch;
}

.section-tinted {
  background: var(--cream);
}

.section-trust-tinted {
  background: #FAF7F2;
  padding: 124px 0;
  position: relative;
}

.section-trust-tinted::before,
.section-trust-tinted::after {
  content: '';
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  width: 80%;
  height: 1px;
  background: var(--green);
  opacity: 0.55;
}
.section-trust-tinted::before { top: 0; }
.section-trust-tinted::after { bottom: 0; }

.section-dark {
  background: var(--ink);
  color: var(--off-white);
}
.section-dark h2, .section-dark h3 { color: var(--off-white); }
.section-dark .eyebrow { color: var(--orange); }
.section-dark p { color: rgba(254,255,254,0.74); }

/* ---------- TRUST CARDS ---------- */

.trust-anchor-group {
  display: flex;
  align-items: center;
  margin-bottom: 36px;
}

.trust-anchor {
  width: 80px;
  height: 80px;
  border-radius: 50%;
  background: var(--green);
  display: grid;
  place-items: center;
  color: white;
  font-family: 'Montserrat', sans-serif;
  font-weight: 600;
  font-size: 0.62rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  text-align: center;
  line-height: 1.2;
  box-shadow: 0 8px 24px rgba(0,128,55,0.18);
  border: 3px solid #FAF7F2;
}
.trust-anchor + .trust-anchor { margin-left: -22px; }
.trust-anchor:nth-child(2) { background: var(--green-deep); }
.trust-anchor span { padding: 0 6px; opacity: 0.92; }

.trust-anchor-meta {
  margin-left: 18px;
  font-family: 'Montserrat', sans-serif;
  font-size: 0.78rem;
  text-transform: uppercase;
  letter-spacing: 0.14em;
  color: var(--ink-soft);
  font-weight: 600;
}
.trust-anchor-meta strong {
  display: block;
  color: var(--ink);
  font-weight: 700;
  letter-spacing: 0.04em;
  font-size: 0.92rem;
  text-transform: none;
  margin-bottom: 2px;
}

.trust-stack {
  display: grid;
  gap: 20px;
}

.trust-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 20px;
}

@media (max-width: 880px) {
  .trust-grid { grid-template-columns: 1fr; }
}

.trust-row-2 {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
}

@media (max-width: 880px) {
  .trust-row-2 { grid-template-columns: 1fr; }
}

.trust-card {
  padding: 40px 36px 32px;
  background: white;
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  display: flex;
  flex-direction: column;
  gap: 18px;
  transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
}

.trust-card:hover {
  transform: translateY(-4px);
  box-shadow: 0 12px 32px rgba(20,32,26,0.08);
  border-color: rgba(0,128,55,0.18);
}

.trust-card.lead {
  padding: 48px 44px 36px;
}

.trust-icon {
  width: 40px;
  height: 40px;
  color: var(--orange);
  display: grid;
  place-items: center;
}

.trust-card h3 {
  margin: 0;
  font-size: 1.18rem;
  line-height: 1.3;
}

.trust-card.lead h3 { font-size: 1.32rem; }

.trust-card p {
  color: var(--ink-soft);
  font-size: 0.98rem;
  line-height: 1.55;
}

.trust-card .pin {
  margin-top: auto;
  margin-left: -36px;
  margin-right: -36px;
  margin-bottom: -32px;
  padding: 16px 36px 0;
  border-top: 1px solid var(--line);
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--green);
  font-family: 'Montserrat', sans-serif;
  font-weight: 600;
  font-size: 0.82rem;
  letter-spacing: 0.02em;
  padding-bottom: 16px;
}

.trust-card.lead .pin {
  margin-left: -44px;
  margin-right: -44px;
  margin-bottom: -36px;
  padding-left: 44px;
  padding-right: 44px;
}

.trust-card .pin svg { flex-shrink: 0; color: var(--green); }

/* Mobile — tighten the Why us section so the bottom doesn't sprawl */
@media (max-width: 720px) {
  .section-trust-tinted { padding: 72px 0 80px; }
  .section-trust-tinted::after { display: none; }

  .trust-anchor-group { margin-bottom: 28px; flex-wrap: wrap; gap: 12px; }
  .trust-anchor { width: 56px; height: 56px; font-size: 0.46rem; letter-spacing: 0.06em; border-width: 2px; }
  .trust-anchor + .trust-anchor { margin-left: -16px; }
  .trust-anchor span { padding: 0 3px; }
  .trust-anchor-meta { font-size: 0.7rem; margin-left: 14px; }
  .trust-anchor-meta strong { font-size: 0.88rem; }

  .trust-stack { gap: 14px; }
  .trust-row-2 { gap: 14px; }

  .trust-card,
  .trust-card.lead { padding: 28px 24px 24px; }
  .trust-card.lead h3 { font-size: 1.18rem; }

  .trust-card .pin,
  .trust-card.lead .pin {
    margin-left: -24px;
    margin-right: -24px;
    margin-bottom: -24px;
    padding: 14px 24px 14px;
  }
}

/* ---------- PROGRAMME ---------- */

.prog-grid {
  display: grid;
  grid-template-columns: 1fr 1.05fr;
  gap: 80px;
  align-items: center;
}

@media (max-width: 960px) {
  .prog-grid { grid-template-columns: 1fr; gap: 40px; }
}

.prog-img {
  border-radius: var(--radius-lg);
  overflow: hidden;
  aspect-ratio: 5/6;
  box-shadow: var(--shadow-md);
}

.prog-facts {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 28px 32px;
  margin: 40px 0;
  padding: 32px 0;
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
}

.prog-fact dt {
  font-family: 'Montserrat', sans-serif;
  font-size: 0.74rem;
  text-transform: uppercase;
  letter-spacing: 0.14em;
  color: var(--ink-soft);
  margin-bottom: 8px;
  font-weight: 600;
}

.prog-fact dd {
  margin: 0;
  font-family: 'Montserrat', sans-serif;
  font-weight: 600;
  font-size: 1.08rem;
  color: var(--ink);
  letter-spacing: -0.01em;
}

.prog-fact dd .sub {
  display: block;
  font-family: 'Lato', sans-serif;
  font-weight: 400;
  font-size: 0.88rem;
  color: var(--ink-soft);
  margin-top: 2px;
  letter-spacing: 0;
}

.prog-list {
  list-style: none;
  padding: 0;
  margin: 0;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.prog-list li {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  color: var(--ink);
  font-size: 1rem;
}

.prog-list .check {
  flex-shrink: 0;
  margin-top: 4px;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: var(--green-soft);
  display: grid;
  place-items: center;
  color: var(--green);
}

/* ---------- DUBLIN GALLERY (uniform 3+2) ---------- */

.dub-grid {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  grid-auto-rows: 280px;
  gap: 20px;
}

.dub-tile { grid-column: span 2; }
.dub-tile:nth-child(4) { grid-column: 2 / span 2; }
.dub-tile:nth-child(5) { grid-column: 4 / span 2; }

.dub-tile {
  position: relative;
  border-radius: var(--radius-md);
  overflow: hidden;
  cursor: pointer;
  transition: transform 0.3s ease;
}
.dub-tile:hover { transform: translateY(-3px); }

.dub-tile .ph-label { display: none; }

.dub-tile-overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, rgba(20,32,26,0) 50%, rgba(20,32,26,0.65) 100%);
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  padding: 22px;
  color: white;
}

.dub-tile-overlay .num {
  font-family: 'JetBrains Mono', ui-monospace, monospace;
  font-size: 0.72rem;
  letter-spacing: 0.08em;
  opacity: 0.85;
}

.dub-tile-overlay .name {
  font-family: 'Montserrat', sans-serif;
  font-weight: 600;
  font-size: 1.25rem;
  letter-spacing: -0.01em;
  margin-top: 4px;
}

.dub-tile-overlay .sub {
  font-size: 0.86rem;
  opacity: 0.85;
  margin-top: 2px;
}

@media (max-width: 880px) {
  .dub-grid { grid-template-columns: 1fr 1fr; grid-auto-rows: 220px; }
  .dub-tile, .dub-tile:nth-child(4), .dub-tile:nth-child(5) { grid-column: auto; }
}

/* ---------- CONTACT ---------- */

.contact-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 64px;
  align-items: start;
}

@media (max-width: 880px) {
  .contact-grid { grid-template-columns: 1fr; gap: 40px; }
}

.contact-info-block {
  display: flex;
  flex-direction: column;
  gap: 24px;
  margin-top: 32px;
}

.contact-row {
  display: flex;
  gap: 16px;
  align-items: flex-start;
  padding: 16px 0;
  border-bottom: 1px solid rgba(254,255,254,0.1);
}

.contact-row:last-child { border-bottom: none; }

.contact-row-icon {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: rgba(0,128,55,0.18);
  color: var(--green);
  display: grid;
  place-items: center;
  flex-shrink: 0;
}

.contact-row-label {
  font-size: 0.78rem;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: rgba(254,255,254,0.55);
  margin-bottom: 2px;
  font-family: 'Montserrat', sans-serif;
  font-weight: 600;
}

.contact-row-value {
  font-family: 'Montserrat', sans-serif;
  font-weight: 500;
  color: white;
  font-size: 1.02rem;
  text-decoration: none;
}
a.contact-row-value:hover { color: var(--orange); }

.contact-row-value .lang {
  font-family: 'Lato', sans-serif;
  font-weight: 400;
  font-size: 0.84rem;
  color: rgba(254,255,254,0.6);
  margin-left: 8px;
}

/* Contact form */
.form-card {
  background: white;
  color: var(--ink);
  border-radius: var(--radius-lg);
  padding: 36px;
  box-shadow: var(--shadow-md);
}

.form-card h3 {
  margin-bottom: 6px;
  font-size: 1.35rem;
}

.form-card .sub {
  color: var(--ink-soft);
  font-size: 0.95rem;
  margin-bottom: 24px;
}

.form-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
  margin-bottom: 14px;
}

.field {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.field.full { grid-column: 1 / -1; }

.field label {
  font-family: 'Montserrat', sans-serif;
  font-size: 0.75rem;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--ink-soft);
  font-weight: 600;
}

.field input, .field textarea, .field select {
  font-family: 'Lato', sans-serif;
  font-size: 0.98rem;
  padding: 12px 14px;
  border: 1px solid var(--line-strong);
  border-radius: 10px;
  background: white;
  color: var(--ink);
  transition: border-color 0.15s ease, box-shadow 0.15s ease;
}

.field input:focus, .field textarea:focus, .field select:focus {
  outline: none;
  border-color: var(--green);
  box-shadow: 0 0 0 3px rgba(0,128,55,0.12);
}

.field textarea { resize: vertical; min-height: 90px; }

.form-card button {
  width: 100%;
  justify-content: center;
  margin-top: 8px;
}

@media (max-width: 720px) {
  .form-card { padding: 24px 20px; border-radius: 16px; }
  .form-row { grid-template-columns: 1fr; gap: 12px; }
  .form-card h3 { font-size: 1.15rem; }
  .contact-grid { gap: 32px; }
}

/* Stop anything from overflowing the viewport.
   Note: do NOT put overflow on html/body — it breaks position: sticky. */
html, body { max-width: 100%; }
.container { max-width: 100%; }
.dub-tile, .form-card, .trust-card, .hero-img, .prog-img { max-width: 100%; }
.field input, .field textarea, .field select { width: 100%; min-width: 0; max-width: 100%; }
input, textarea, select { box-sizing: border-box; }
.contact-row-value { word-break: break-word; }

/* Clip overflow at the section level instead of the document level */
.hero, .section, .footer { overflow-x: clip; }

.form-note {
  margin-top: 16px;
  font-size: 1rem;
  color: var(--ink-soft);
  text-align: center;
  font-weight: 400;
  line-height: 1.5;
}

.form-success {
  background: var(--green-soft);
  border: 1px solid rgba(0,128,55,0.18);
  color: var(--green-deep);
  border-radius: 10px;
  padding: 14px 16px;
  font-size: 0.94rem;
  margin-bottom: 14px;
  display: flex;
  align-items: center;
  gap: 10px;
}

/* ---------- FOOTER ---------- */

.footer {
  padding: 48px 0 56px;
  border-top: 1px solid var(--line);
  background: var(--off-white);
  color: var(--ink-soft);
}

.footer-inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  flex-wrap: wrap;
}

.footer .brand-line {
  display: flex;
  align-items: center;
  gap: 14px;
  font-size: 0.92rem;
}

.footer-links {
  display: flex;
  align-items: center;
  gap: 24px;
  font-size: 0.92rem;
}

.footer-links a {
  color: var(--ink-soft);
  text-decoration: none;
  white-space: nowrap;
}
.footer-links a:hover { color: var(--green); }

.footer-social {
  display: inline-grid;
  place-items: center;
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: var(--green-soft);
  color: var(--green) !important;
  transition: background 0.15s ease, transform 0.15s ease;
}
.footer-social:hover { background: var(--green); color: white !important; transform: translateY(-1px); }

/* ---------- DECOR ---------- */

.deco-line {
  display: inline-block;
  width: 36px;
  height: 1.5px;
  background: var(--orange);
  vertical-align: middle;
  margin-right: 14px;
}

/* fade-in on scroll */
.fade-up {
  opacity: 1;
  transform: none;
  transition: opacity 0.7s ease, transform 0.7s ease;
}
.fade-up.in {
  opacity: 1;
  transform: translateY(0);
}
</style>

<script src="8a5d3369-9d69-4771-8f24-8c03e3ad157a" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<body>
<div id="root"></div>

<script type="text/babel" src="12cc8071-dc7b-4509-ab0e-8f1fc68cb366"></script>
<script type="text/babel" src="05e6e48c-71ae-4930-8cd2-155100cc94b7"></script>

<script type="text/babel">
const { useState, useEffect } = React;

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "ctaText": "Register interest",
  "heroPhoto": "trinity",
  "showBadge": true,
  "accentColor": "#FF914D",
  "primaryColor": "#008037",
  "headlineFont": "Montserrat",
  "dublinFirst": false
}/*EDITMODE-END*/;

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [overHero, setOverHero] = useState(true);

  useEffect(() => {
    const onScroll = () => setOverHero(window.scrollY < window.innerHeight * 0.75);
    window.addEventListener('scroll', onScroll, { passive: true });
    return () => window.removeEventListener('scroll', onScroll);
  }, []);

  useEffect(() => {
    const r = document.documentElement.style;
    r.setProperty('--green', t.primaryColor);
    r.setProperty('--orange', t.accentColor);
    r.setProperty('--green-soft', hexToSoft(t.primaryColor));
    r.setProperty('--green-deep', hexToDeep(t.primaryColor));
  }, [t.primaryColor, t.accentColor]);

  // Headline font: offline build only supports the default. Skip dynamic Google Fonts loads
  // when this file is opened standalone (the loaded link wouldn't resolve anyway).
  useEffect(() => {
    document.body.style.setProperty('--head-font', `'${t.headlineFont}', system-ui, sans-serif`);
    let styleEl = document.getElementById('headline-font-style');
    if (!styleEl) {
      styleEl = document.createElement('style');
      styleEl.id = 'headline-font-style';
      document.head.appendChild(styleEl);
    }
    styleEl.textContent = `h1,h2,h3,h4,h5,.display,.nav-brand,.eyebrow,.btn,.hero-tag,.hero-tag-pill,.trust-num,.hero-meta-item .num,.prog-fact dt,.prog-fact dd,.contact-row-label,.contact-row-value,.field label,.form-card h3,.dub-tile-overlay .name,.nav-mark { font-family: '${t.headlineFont}', system-ui, sans-serif !important; }`;
  }, [t.headlineFont]);

  useEffect(() => {
    const els = document.querySelectorAll('.fade-up');
    const io = new IntersectionObserver((entries) => {
      entries.forEach((e) => { if (e.isIntersecting) e.target.classList.add('in'); });
    }, { threshold: 0.12 });
    els.forEach((el) => io.observe(el));
    return () => io.disconnect();
  }, []);

  return (
    <React.Fragment>
      <Nav ctaText={t.ctaText} overHero={overHero} />
      <Hero ctaText={t.ctaText} heroPhoto={t.heroPhoto} showBadge={t.showBadge} />
      <Trust />
      {t.dublinFirst ? (
        <React.Fragment>
          <Dublin />
          <Programme />
        </React.Fragment>
      ) : (
        <React.Fragment>
          <Programme />
          <Dublin />
        </React.Fragment>
      )}
      <Contact ctaText={t.ctaText} />
      <Footer />

      <TweaksPanel title="Tweaks">
        <TweakSection label="Calls to action">
          <TweakRadio
            label="CTA copy"
            value={t.ctaText}
            options={['Find out more', 'Register interest', 'Reserve a place']}
            onChange={(v) => setTweak('ctaText', v)}
          />
        </TweakSection>

        <TweakSection label="Hero">
          <TweakSelect
            label="Hero photo"
            value={t.heroPhoto}
            options={[
              { value: 'trinity', label: 'Trinity College' },
              { value: 'wicklow', label: 'Wicklow Mountains' }
            ]}
            onChange={(v) => setTweak('heroPhoto', v)}
          />
          <TweakToggle
            label="Price badge"
            value={t.showBadge}
            onChange={(v) => setTweak('showBadge', v)}
          />
        </TweakSection>

        <TweakSection label="Palette">
          <TweakColor
            label="Primary"
            value={t.primaryColor}
            options={['#008037', '#0A5C3A', '#1F6B4D', '#2A6F5C']}
            onChange={(v) => setTweak('primaryColor', v)}
          />
          <TweakColor
            label="Accent"
            value={t.accentColor}
            options={['#FF914D', '#E07A3B', '#F2B25C', '#C9543A']}
            onChange={(v) => setTweak('accentColor', v)}
          />
        </TweakSection>

        <TweakSection label="Section order">
          <TweakToggle
            label="Dublin before programme"
            value={t.dublinFirst}
            onChange={(v) => setTweak('dublinFirst', v)}
          />
        </TweakSection>
      </TweaksPanel>
    </React.Fragment>
  );
}

function hexToSoft(hex) {
  const { r, g, b } = hexRgb(hex);
  const mix = (c) => Math.round(c + (255 - c) * 0.9);
  return `rgb(${mix(r)}, ${mix(g)}, ${mix(b)})`;
}
function hexToDeep(hex) {
  const { r, g, b } = hexRgb(hex);
  const dark = (c) => Math.max(0, Math.round(c * 0.78));
  return `rgb(${dark(r)}, ${dark(g)}, ${dark(b)})`;
}
function hexRgb(hex) {
  const h = hex.replace('#', '');
  const n = h.length === 3 ? h.split('').map((c) => c + c).join('') : h;
  return {
    r: parseInt(n.slice(0,2), 16),
    g: parseInt(n.slice(2,4), 16),
    b: parseInt(n.slice(4,6), 16)
  };
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
