# No catch-all redirect rules on purpose. Only exact, single-path short links
# (see the bottom of this file).
#
# There used to be a single rule here meant to strip trailing slashes:
#
#   [[redirects]]
#     from = "/*/"
#     to = "/:splat"
#     status = 301
#
# It made every URL that does not exist redirect to itself forever. Netlify
# normalises the trailing slash off the `from` pattern, so the rule was really
# `/*` -> `/:splat`, i.e. every path to itself. Real pages survived it because a
# non-forced rule does not shadow a file that exists; missing pages had nothing
# to shadow, so they looped until the browser gave up. Nobody ever saw a 404.
#
# Netlify already canonicalises trailing slashes on its own: /contact returns
# 301 to /contact/, which returns 200. That is Netlify's pretty-URL handling,
# not a rule of ours, and deleting the rule did not change it.
#
# Missing pages now fall through to src/pages/404.astro, which Astro builds to
# dist/404.html and Netlify serves with a 404 status.
#
# If you are about to add a catch-all rule here: it will match real pages too,
# and this file governs every URL on the site, so it is the one change in the
# repo that can affect indexing. Curl a real page and a missing one, before and
# after, and check the status AND the Location header on both.

# Pings IndexNow (Bing, and so ChatGPT search) after every production deploy.
# See plugins/indexnow/index.js.
[[plugins]]
  package = "/plugins/indexnow"

# Sends the old Netlify address to the real domain, so search engines stop
# showing immersionenglish.netlify.app as a second copy of the site (Nov 2026).
# It was still turning up in search results with out-of-date snippets.
#
# This is NOT the catch-all warned about above: `from` starts with a full host,
# so it only matches requests made to immersionenglish.netlify.app itself. It
# cannot match immersion-english.com, and it does not match deploy previews
# (deploy-preview-N--immersionenglish.netlify.app is a different host).
# `force` is needed because the pages exist on that host too.
[[redirects]]
  from = "https://immersionenglish.netlify.app/*"
  to = "https://immersion-english.com/:splat"
  status = 301
  force = true

# Short link printed on the business cards for the Sofia private schools fair
# (Oct 2026). Exact path only, no splat, so it cannot touch real pages.
# 302 so search engines never index /dublin2027 in place of the real page.
# Every visit here is counted as the fair in GA4, so use it on fair materials only.
# Old-site addresses still known to Google (Search Console 404s, Nov 2026)
[[redirects]]
  from = "/home"
  to = "/"
  status = 301

[[redirects]]
  from = "/contact-us"
  to = "/contact"
  status = 301

[[redirects]]
  from = "/dublin2027"
  to = "/dublin-summer-2027?utm_source=private-schools-fair&utm_medium=print&utm_campaign=dublin-2027&utm_content=business-card"
  status = 302

# Short link for the DET carousel post on Facebook (18 Nov 2026), in the post text
# and the first comment. Same rules as /dublin2027: exact path, 302, and every
# visit is counted as that organic Facebook post in GA4, so use it there only.
# #offer lands visitors on the "Prepare with a DET partner" section.
[[redirects]]
  from = "/det"
  to = "/duolingo-english-test?utm_source=facebook&utm_medium=organic&utm_campaign=det_launch&utm_content=carousel#offer"
  status = 302

# Short link for social posts about the free DET guides (Nov 2026). Lands on the
# downloads block of the DET page; counted as organic social in GA4.
[[redirects]]
  from = "/det-guide"
  to = "/duolingo-english-test?utm_source=social&utm_medium=organic&utm_campaign=det_guide#downloads"
  status = 302

# Short link for the DET comparison post on Facebook (Nov 2026): the table of
# DET vs IELTS vs Cambridge. Same rules as /det: exact path, 302, and every
# visit is counted as that organic Facebook post in GA4, so use it there only.
# #get-the-test lands visitors on the "Book through us" card itself (the partner
# link), so on a phone they don't scroll past the consultation and lessons cards.
[[redirects]]
  from = "/det-compare"
  to = "/duolingo-english-test?utm_source=facebook&utm_medium=organic&utm_campaign=det_compare&utm_content=comparison_post#get-the-test"
  status = 302
